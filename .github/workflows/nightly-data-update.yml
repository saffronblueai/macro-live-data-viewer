name: Nightly Data Fetch and Update

on:
  schedule:
    # Run every evening at 8 PM UTC (adjust as needed)
    - cron: "0 20 * * *"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  update-data:
    name: Fetch Data and Update S3
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get S3 bucket name from Pulumi
        id: get-bucket
        working-directory: ./infrastructure
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pip install pulumi pulumi-aws
          BUCKET_NAME=$(pulumi stack output bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Download existing data from S3
        run: |
          mkdir -p data
          aws s3 sync s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/ data/ \
            --exclude "*" \
            --include "*.csv" || echo "No existing CSV files in S3"

      - name: Update sentiment data
        continue-on-error: true
        run: |
          python src/fetch_sentiment.py --update-all

      - name: Update market data
        continue-on-error: true
        run: |
          python src/fetch_data.py update

      - name: Upload updated data to S3
        run: |
          aws s3 sync data/ s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/ \
            --exclude ".gitkeep" \
            --exclude "*.log" \
            --no-overwrite
          aws s3 cp src/data.js s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/data.js --content-type "application/javascript"

      - name: Commit and push updated CSV files (optional)
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: update data files from nightly fetch" || echo "No changes to commit"
          git push

      - name: Log update completion
        run: |
          echo "=== Data Update Complete ==="
          echo "Updated files uploaded to S3 bucket: ${{ steps.get-bucket.outputs.BUCKET_NAME }}"
