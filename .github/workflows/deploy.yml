name: Deploy to AWS S3

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Infrastructure and Website
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Pulumi
        uses: pulumi/actions@v4
        with:
          pulumi-version: 3.x.x

      - name: Install infrastructure dependencies
        working-directory: ./infrastructure
        run: |
          pip install -r requirements.txt

      - name: Initialize Pulumi local backend
        run: |
          pulumi login --local

      - name: Download Pulumi state from S3
        continue-on-error: true
        run: |
          mkdir -p ~/.pulumi
          aws s3 sync s3://macro-live-data-viewer-bucket/pulumi-state/ ~/.pulumi/ || echo "No existing Pulumi state in S3"

      - name: Fix Pulumi plugin permissions
        run: |
          if [ -d "$HOME/.pulumi/plugins" ]; then
            chmod +x $HOME/.pulumi/plugins/*/pulumi-resource-* || true
            echo "Fixed permissions on Pulumi plugins"
          fi

      - name: Deploy infrastructure with Pulumi
        working-directory: ./infrastructure
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi stack select prod --create
          pulumi up --yes

      - name: Get S3 bucket name from Pulumi
        id: get-bucket
        working-directory: ./infrastructure
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          BUCKET_NAME=$(pulumi stack output bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload website files to S3
        run: |
          # Upload HTML and JS files from src/ to root (flattened)
          aws s3 cp src/index.html s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/index.html
          aws s3 cp src/data.js s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/data.js
          
          # Upload CSV data files to root (flattened, preserve existing)
          aws s3 sync data/ s3://${{ steps.get-bucket.outputs.BUCKET_NAME }}/ \
            --exclude ".gitkeep" \
            --exclude "*.log" \
            --no-overwrite

      - name: Print deployment information
        working-directory: ./infrastructure
        run: |
          echo "=== Deployment Complete ==="
          echo "Website URL: $(pulumi stack output website_url)"
          echo "S3 Bucket: $(pulumi stack output bucket_name)"

      - name: Upload Pulumi state to S3
        if: always()
        run: |
          if [ -d "$HOME/.pulumi" ]; then
            aws s3 sync $HOME/.pulumi/ s3://macro-live-data-viewer-bucket/pulumi-state/ --delete
            echo "Pulumi state uploaded to S3 bucket: s3://macro-live-data-viewer-bucket/pulumi-state/"
          else
            echo "No ~/.pulumi directory to upload"
          fi
