name: Deploy to AWS S3

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Infrastructure and Website
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Pulumi
        uses: pulumi/actions@v4
        with:
          pulumi-version: 3.x.x

      - name: Install infrastructure dependencies
        working-directory: ./infrastructure
        run: |
          pip install -r requirements.txt

      - name: Initialize Pulumi local backend
        run: |
          pulumi login --local

      - name: Deploy infrastructure with Pulumi
        working-directory: ./infrastructure
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi stack select prod --create
          pulumi up --yes

      - name: Get S3 bucket name from Pulumi
        id: get-bucket
        working-directory: ./infrastructure
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          BUCKET_NAME=$(pulumi stack output bucket_name)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload website files to S3
        run: |
          # Upload application files (allow overwrites)
          aws s3 sync . s3://${{ steps.get-bucket.outputs.BUCKET_NAME }} \
            --exclude "*" \
            --include "src/index.html" \
            --include "src/data.js"
          
          # Upload CSV data files (preserve existing)
          aws s3 sync . s3://${{ steps.get-bucket.outputs.BUCKET_NAME }} \
            --exclude "*" \
            --include "data/bond_yields_10y.csv" \
            --include "data/stock_indices.csv" \
            --include "data/currencies.csv" \
            --include "data/sentiment_data.csv" \
            --include "data/sentiment_data_domestic.csv" \
            --include "data/countries_tickers.csv" \
            --no-overwrite

      - name: Print deployment information
        working-directory: ./infrastructure
        run: |
          echo "=== Deployment Complete ==="
          echo "Website URL: $(pulumi stack output website_url)"
          echo "S3 Bucket: $(pulumi stack output bucket_name)"

      - name: Commit Pulumi state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .pulumi/
          git commit -m "chore: update pulumi state files" || echo "No state changes to commit"
          git push
