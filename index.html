<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Data Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="data.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tab-navigation {
            display: flex;
            gap: 4px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: none;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: white;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .lookback-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-right: 4px;
        }

        .lookback-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .lookback-btn:hover {
            border-color: rgba(0, 212, 255, 0.5);
            background: rgba(0, 212, 255, 0.1);
        }

        .lookback-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .index-mode-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .index-mode-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .index-mode-btn:hover {
            border-color: rgba(244, 114, 182, 0.5);
            background: rgba(244, 114, 182, 0.1);
        }

        .index-mode-btn.active {
            border-color: #f472b6;
            background: rgba(244, 114, 182, 0.2);
            color: #f472b6;
        }

        .smoothing-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }

        .smoothing-control.hidden {
            display: none;
        }

        .smoothing-input {
            width: 50px;
            padding: 6px 8px;
            border: 2px solid rgba(244, 114, 182, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #f472b6;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
        }

        .smoothing-input:hover, .smoothing-input:focus {
            border-color: #f472b6;
            outline: none;
        }

        .smoothing-input::-webkit-inner-spin-button,
        .smoothing-input::-webkit-outer-spin-button {
            opacity: 1;
        }

        .view-controls {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .view-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .view-btn.active {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: white;
        }

        .container {
            padding: 30px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .charts-grid {
            display: grid;
            gap: 25px;
            transition: all 0.3s ease;
        }

        .charts-grid.view-1 {
            grid-template-columns: 1fr;
        }

        .charts-grid.view-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .charts-grid.view-4 {
            grid-template-columns: repeat(2, 1fr);
        }

        .chart-tile {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .chart-tile:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .tile-selectors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tile-select {
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tile-select:hover, .tile-select:focus {
            border-color: #00d4ff;
            outline: none;
        }

        .tile-select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .data-type-select {
            min-width: 140px;
        }

        .country-select {
            min-width: 160px;
        }

        .country-select optgroup {
            font-weight: 600;
            color: #00d4ff;
            background: #1a1a2e;
            padding: 4px 0;
        }

        .country-select option {
            font-weight: 400;
            color: #e0e0e0;
            padding-left: 10px;
        }

        .sentiment-select {
            min-width: 180px;
            border-color: rgba(236, 72, 153, 0.4);
        }

        .sentiment-select:hover, .sentiment-select:focus {
            border-color: #f472b6;
        }

        .sentiment-index-select {
            min-width: 110px;
            border-color: rgba(236, 72, 153, 0.4);
            font-size: 0.85rem;
        }

        .sentiment-index-select:hover, .sentiment-index-select:focus {
            border-color: #f472b6;
        }

        .sentiments-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .sentiment-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sentiment-row .color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .sentiment-row select {
            font-size: 0.8rem;
            padding: 4px 6px;
        }

        .sentiment-row .sentiment-topic-select {
            min-width: 140px;
            flex: 1;
        }

        .sentiment-row .sentiment-type-select,
        .sentiment-row .sentiment-agg-select,
        .sentiment-row .sentiment-transform-select {
            min-width: 50px;
        }

        .sentiment-row .sentiment-smoothing-input {
            width: 40px;
            padding: 4px 4px;
            text-align: center;
            font-size: 0.75rem;
        }

        .remove-sentiment-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .remove-sentiment-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            border-color: #ef4444;
        }

        .add-sentiment-btn {
            background: rgba(244, 114, 182, 0.15);
            border: 1px dashed rgba(244, 114, 182, 0.4);
            color: #f472b6;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            align-self: flex-start;
        }

        .add-sentiment-btn:hover {
            background: rgba(244, 114, 182, 0.3);
            border-color: #f472b6;
        }

        .add-sentiment-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .value-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .current-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .sentiment-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f472b6;
        }

        .value-change {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .value-change.positive {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .value-change.negative {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .data-type-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .data-type-label.bond_yields {
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
        }

        .data-type-label.currencies {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .data-type-label.stock_indices {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .data-type-label.sentiment {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .view-1 .chart-container {
            height: 480px;
        }

        .view-2 .chart-container {
            height: 320px;
        }

        .no-data {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #666;
            font-style: italic;
        }

        .legend-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sentiment-suggestions {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .suggestions-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .suggestions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .suggestion-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(244, 114, 182, 0.15);
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 12px;
            font-size: 0.68rem;
            color: #f472b6;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-chip:hover {
            background: rgba(244, 114, 182, 0.3);
            border-color: #f472b6;
            transform: translateY(-1px);
        }

        .suggestion-chip .corr-value {
            font-weight: 600;
            color: #a7f3d0;
            font-size: 0.65rem;
        }

        .suggestion-chip .corr-value.negative {
            color: #fca5a5;
        }

        .suggestion-tooltip {
            position: absolute;
            background: rgba(20, 20, 40, 0.98);
            border: 1px solid rgba(244, 114, 182, 0.5);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.75rem;
            color: #e0e0e0;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .suggestion-tooltip .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 4px;
        }

        .suggestion-tooltip .tooltip-row:last-child {
            margin-bottom: 0;
        }

        .suggestion-tooltip .tooltip-label {
            color: rgba(255,255,255,0.6);
        }

        .suggestion-tooltip .tooltip-value {
            color: #f472b6;
            font-weight: 500;
        }

        .suggestion-tooltip .tooltip-corr {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .suggestion-tooltip .tooltip-corr.positive {
            color: #a7f3d0;
        }

        .suggestion-tooltip .tooltip-corr.negative {
            color: #fca5a5;
        }

        .legend-color {
            width: 16px;
            height: 3px;
            border-radius: 2px;
        }

        @media (max-width: 1200px) {
            .charts-grid.view-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .charts-grid.view-2,
            .charts-grid.view-4 {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .tile-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .tile-selectors {
                width: 100%;
            }

            .tile-select {
                flex: 1;
                min-width: 0;
            }
        }

        /* Thematics Page Styles */
        .thematics-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thematics-control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .thematics-control-group label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .thematics-control-group select,
        .thematics-control-group input {
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .thematics-control-group select:hover,
        .thematics-control-group select:focus,
        .thematics-control-group input:hover,
        .thematics-control-group input:focus {
            border-color: #00d4ff;
            outline: none;
        }

        .thematics-control-group select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .topic-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topic-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .topic-checkbox:hover {
            border-color: rgba(244, 114, 182, 0.5);
            background: rgba(244, 114, 182, 0.1);
        }

        .topic-checkbox.active {
            border-color: #f472b6;
            background: rgba(244, 114, 182, 0.2);
            color: #f472b6;
        }

        .topic-checkbox input {
            display: none;
        }

        .column-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 36px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .column-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            color: #00d4ff;
        }

        .column-toggle:hover {
            background: rgba(0, 212, 255, 0.25);
            border-color: #00d4ff;
        }

        .column-toggle.hidden {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
        }

        .column-toggle.hidden:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.6);
        }

        .column-toggle .topic-group-tag {
            font-size: 0.65rem;
            padding: 1px 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
        }

        .column-toggles-empty {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
            font-size: 0.8rem;
            padding: 4px;
        }

        .custom-countries-wrapper {
            position: relative;
            display: none;
        }

        .custom-countries-wrapper.visible {
            display: block;
        }

        .custom-countries-input {
            width: 350px;
        }

        .country-autocomplete {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(26, 26, 46, 0.98);
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 100;
            display: none;
        }

        .country-autocomplete.active {
            display: block;
        }

        .country-autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .country-autocomplete-item:hover,
        .country-autocomplete-item.highlighted {
            background: rgba(0, 212, 255, 0.15);
        }

        .country-autocomplete-item .country-code {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            margin-left: auto;
        }

        .country-autocomplete-item.selected {
            background: rgba(34, 197, 94, 0.2);
        }

        .country-autocomplete-item.selected::after {
            content: '✓';
            margin-left: auto;
            color: #22c55e;
        }

        .selected-countries-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .country-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #00d4ff;
        }

        .country-tag .remove-tag {
            cursor: pointer;
            opacity: 0.6;
            margin-left: 2px;
        }

        .country-tag .remove-tag:hover {
            opacity: 1;
        }

        .thematics-table-wrapper {
            overflow: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thematics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: fixed;
        }

        .thematics-table tbody tr {
            height: 30px;
        }

        .thematics-table th,
        .thematics-table td {
            padding: 4px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            line-height: 20px;
            height: 30px;
            vertical-align: middle;
            overflow: hidden;
            box-sizing: border-box;
        }

        .thematics-table th {
            background: rgba(255, 255, 255, 0.08);
            font-weight: 600;
            color: #00d4ff;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 0.8rem;
            max-width: 120px;
            white-space: normal;
            word-wrap: break-word;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .thematics-table th:hover {
            background: rgba(0, 212, 255, 0.15);
        }

        .thematics-table th.sorted {
            background: rgba(0, 212, 255, 0.2);
        }

        .thematics-table th .sort-indicator {
            margin-left: 4px;

    <script>
        // Data type configurations
        const DATA_TYPES = {
            bond_yields: {
                name: '10Y Bond Yield',
                unit: '%',
                decimals: 3,
                formatValue: (v) => v.toFixed(3) + '%',

                formatAxis: (v) => v.toFixed(1) + '%'
            },
            currencies: {
                name: 'Currency vs USD',
                unit: 'USD',
                decimals: 4,
                formatValue: (v) => v.toFixed(4),

            stock_indices: {
                name: 'Stock Index',

                formatAxis: (v) => v >= 1000 ? (v/1000).toFixed(0) + 'K' : v.toFixed(0)
            }
        };

        // Country ticker mappings (currency and stock index codes)
        const COUNTRY_TICKERS = {
            United_States: { currency: 'DXY', stock: 'S&P 500' },
            China: { currency: 'CNYUSD', stock: 'SSE' },
            Japan: { currency: 'JPYUSD', stock: 'N225' },
            Germany: { currency: 'EURUSD', stock: 'DAX' },
            United_Kingdom: { currency: 'GBPUSD', stock: 'FTSE' },
            India: { currency: 'INRUSD', stock: 'SENSEX' },
            France: { currency: 'EURUSD', stock: 'CAC' },
            Italy: { currency: 'EURUSD', stock: 'MIB' },
            Brazil: { currency: 'BRLUSD', stock: 'BVSP' },
            Canada: { currency: 'CADUSD', stock: 'TSX' },
            Russia: { currency: 'RUBUSD', stock: 'MOEX' },
            South_Korea: { currency: 'KRWUSD', stock: 'KOSPI' },
            Australia: { currency: 'AUDUSD', stock: 'ASX' },
            Mexico: { currency: 'MXNUSD', stock: 'MXX' },
            Spain: { currency: 'EURUSD', stock: 'IBEX' },
            Indonesia: { currency: 'IDRUSD', stock: 'JKSE' },
            Netherlands: { currency: 'EURUSD', stock: 'AEX' },
            Saudi_Arabia: { currency: 'SARUSD', stock: 'TASI' },

            Sweden: { currency: 'SEKUSD', stock: 'OMX' },

            Thailand: { currency: 'THBUSD', stock: 'SET' },
            Ireland: { currency: 'EURUSD', stock: 'ISEQ' },
            Israel: { currency: 'ILSUSD', stock: 'TA125' },
            Austria: { currency: 'EURUSD', stock: 'ATX' },
            Norway: { currency: 'NOKUSD', stock: 'OSEAX' },
            United_Arab_Emirates: { currency: 'AEDUSD', stock: 'DFMGI' },
            Nigeria: { currency: 'NGNUSD', stock: 'NGSE' },
            Singapore: { currency: 'SGDUSD', stock: 'STI' },
            South_Africa: { currency: 'ZARUSD', stock: 'JSE' },
            Malaysia: { currency: 'MYRUSD', stock: 'KLSE' },
            Denmark: { currency: 'DKKUSD', stock: 'OMXC25' },
            Philippines: { currency: 'PHPUSD', stock: 'PSEi' },
            Hong_Kong: { currency: 'HKDUSD', stock: 'HSI' },
            Vietnam: { currency: 'VNDUSD', stock: 'VNINDEX' },
            Bangladesh: { currency: 'BDTUSD', stock: 'DSEX' },
            Pakistan: { currency: 'PKRUSD', stock: 'KSE100' },
            Chile: { currency: 'CLPUSD', stock: 'IPSA' },
            Colombia: { currency: 'COPUSD', stock: 'COLCAP' },
            Finland: { currency: 'EURUSD', stock: 'OMXH25' },
            Portugal: { currency: 'EURUSD', stock: 'PSI20' },
            New_Zealand: { currency: 'NZDUSD', stock: 'NZ50' },
            Czech_Republic: { currency: 'CZKUSD', stock: 'PX' },
            Greece: { currency: 'EURUSD', stock: 'ATHEX' },
            Peru: { currency: 'PENUSD', stock: 'SPBL' },
            Qatar: { currency: 'QARUSD', stock: 'QSI' }
        };

        // Country groups by region
        const COUNTRY_REGIONS = {
            'Americas': ['United_States', 'Canada', 'Mexico', 'Brazil', 'Argentina', 'Chile', 'Colombia', 'Peru'],
            'Europe': ['United_Kingdom', 'Germany', 'France', 'Italy', 'Spain', 'Netherlands', 'Switzerland', 'Belgium', 'Sweden', 'Poland', 'Austria', 'Norway', 'Denmark', 'Finland', 'Ireland', 'Portugal', 'Greece', 'Czech_Republic'],
            'Asia Pacific': ['China', 'Japan', 'India', 'South_Korea', 'Australia', 'Indonesia', 'Taiwan', 'Thailand', 'Singapore', 'Malaysia', 'Philippines', 'Hong_Kong', 'Vietnam', 'Bangladesh', 'Pakistan', 'New_Zealand'],
            'Middle East & Africa': ['Saudi_Arabia', 'United_Arab_Emirates', 'Israel', 'Turkey', 'Qatar', 'South_Africa', 'Nigeria'],
            'Other': ['Russia']
        };

        // Get region for a country
        function getCountryRegion(countryId) {
            for (const [region, countries] of Object.entries(COUNTRY_REGIONS)) {
                if (countries.includes(countryId)) return region;
            }
            return 'Other';
        }

        // Build country dropdown HTML with optgroups by region
        function buildCountryDropdownHTML(availableCountries, selectedCountry) {
            // Group available countries by region
            const grouped = {};
            for (const country of availableCountries) {
                const region = getCountryRegion(country);
                if (!grouped[region]) grouped[region] = [];
                grouped[region].push(country);
            }
            
            // Build HTML with optgroups
            let html = '';
            const regionOrder = ['Americas', 'Europe', 'Asia Pacific', 'Middle East & Africa', 'Other'];
            
            for (const region of regionOrder) {
                const countries = grouped[region];
                if (!countries || countries.length === 0) continue;
                
                html += `<optgroup label="${region}">`;
                for (const c of countries) {
                    html += `<option value="${c}" ${c === selectedCountry ? 'selected' : ''}>
                        ${getCountryFlag(c)} ${getCountryName(c)}
                    </option>`;
                }
                html += '</optgroup>';
            }
            
            return html;
        }

        // Chart colors
        const MAIN_COLOR = { line: '#00d4ff', bg: 'rgba(0, 212, 255, 0.1)' };
        
        // Multiple sentiment colors (up to 4)
        const SENTIMENT_COLORS = [
            { line: '#f472b6', bg: 'rgba(244, 114, 182, 0.1)' },  // Pink
            { line: '#a78bfa', bg: 'rgba(167, 139, 250, 0.1)' },  // Purple
            { line: '#fbbf24', bg: 'rgba(251, 191, 36, 0.1)' },   // Amber
            { line: '#34d399', bg: 'rgba(52, 211, 153, 0.1)' }    // Emerald
        ];
        const MAX_SENTIMENTS = 4;

        let allData = null;
        let sentimentDataIntl = null;
        let sentimentDataDomestic = null;
        let sentimentTopics = [];
        let charts = {};
        let currentView = 2;
        let lookbackDays = 90; // 30 = 1M, 90 = 3M
        
        // State per tile: {dataType, country, sentiments: [{topic, indexType, inverted, mode, smoothing, transform}, ...]}
        let tileStates = [
            { dataType: 'bond_yields', country: 'United_States', sentiments: [{ topic: 'Economic Data', indexType: 'international', inverted: false, mode: 'daily', smoothing: 14, transform: 'rolling' }] },
            { dataType: 'stock_indices', country: 'Germany', sentiments: [{ topic: 'Economic Data', indexType: 'international', inverted: false, mode: 'daily', smoothing: 14, transform: 'rolling' }] },
            { dataType: 'currencies', country: 'Japan', sentiments: [{ topic: 'Economic Data', indexType: 'international', inverted: false, mode: 'daily', smoothing: 14, transform: 'rolling' }] },
            { dataType: 'bond_yields', country: 'China', sentiments: [{ topic: 'Economic Data-GDP', indexType: 'international', inverted: false, mode: 'daily', smoothing: 14, transform: 'rolling' }] }
        ];

        // Load data from data.js
        function loadData() {
            if (typeof ALL_DATA !== 'undefined') {
                allData = ALL_DATA;
                sentimentDataIntl = typeof SENTIMENT_DATA_INTERNATIONAL !== 'undefined' ? SENTIMENT_DATA_INTERNATIONAL : {};
                sentimentDataDomestic = typeof SENTIMENT_DATA_DOMESTIC !== 'undefined' ? SENTIMENT_DATA_DOMESTIC : {};
                sentimentTopics = typeof SENTIMENT_TOPICS !== 'undefined' ? SENTIMENT_TOPICS : [];
                renderCharts();
                updateLastUpdatedDisplay();
            } else {
                document.getElementById('chartsGrid').innerHTML = 
                    '<div class="no-data">Error: Data not loaded. Run "python fetch_data.py generate" to generate data.js.</div>';
            }
        }

        // Get available countries for a data type
        function getAvailableCountries(dataType) {
            if (!allData || !allData[dataType]) return [];
            return Object.keys(allData[dataType]).filter(c => 
                allData[dataType][c] && allData[dataType][c].length > 0
            );
        }

        // Get country display name
        function getCountryName(countryId) {
            return (typeof COUNTRY_NAMES !== 'undefined' && COUNTRY_NAMES[countryId]) 
                ? COUNTRY_NAMES[countryId] 
                : countryId.replace(/_/g, ' ');
        }

        // Get country flag
        function getCountryFlag(countryId) {
            return (typeof COUNTRY_FLAGS !== 'undefined' && COUNTRY_FLAGS[countryId]) 
                ? COUNTRY_FLAGS[countryId] 
                : '';
        }

        // Get data type label with ticker code
        function getDataTypeLabel(dataType, country) {
            const config = DATA_TYPES[dataType];
            const tickers = COUNTRY_TICKERS[country];
            if (tickers) {
                if (dataType === 'currencies' && tickers.currency) {
                    return `Currency (${tickers.currency})`;
                } else if (dataType === 'stock_indices' && tickers.stock) {
                    return `Stock Index (${tickers.stock})`;
                }
            }
            return config.name;
        }

        // Get main data for chart (filtered by lookback period)
        function getMainData(state) {
            const data = (allData[state.dataType] && allData[state.dataType][state.country]) || [];
            if (data.length === 0) return [];
            
            // Filter to most recent lookbackDays
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - lookbackDays);
            const cutoffStr = cutoffDate.toISOString().split('T')[0];
            
            return data.filter(d => d.date >= cutoffStr);
        }

        // Apply z-score transformation to data
        function applyZScore(data, values) {
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / values.length;
            const stdDev = Math.sqrt(variance);
            
            if (stdDev === 0) return data.map(d => ({ ...d, value: 0 }));
            return data.map(d => ({ ...d, value: (d.value - mean) / stdDev }));
        }

        // Get sentiment data for overlay (cumulative or daily, filtered by lookback)
        // sentiment: {topic, indexType, inverted, mode, smoothing, transform} or null
        function getSentimentData(country, sentiment) {
            if (!sentiment || !sentiment.topic) return [];
            
            const topic = sentiment.topic;
            const indexType = sentiment.indexType || 'international';
            const inverted = sentiment.inverted || false;
            const mode = sentiment.mode || 'daily';
            const smoothing = sentiment.smoothing || 14;
            const transform = sentiment.transform || 'rolling';
            
            // Select the right data source based on index type
            const sentimentData = indexType === 'domestic' ? sentimentDataDomestic : sentimentDataIntl;
            
            if (!sentimentData || !topic || !sentimentData[topic]) return [];
            const rawData = sentimentData[topic][country] || [];
            if (rawData.length === 0) return [];
            
            // Filter to lookback period first
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - lookbackDays);
            const cutoffStr = cutoffDate.toISOString().split('T')[0];
            
            // Sort by date, filter to lookback period
            const sorted = [...rawData]
                .sort((a, b) => a.date.localeCompare(b.date))
                .filter(d => d.date >= cutoffStr);
            
            const multiplier = inverted ? -1 : 1;
            
            if (mode === 'cumulative') {
                // Cumulative mode: running sum
                let cumSum = 0;
                let result = sorted.map(d => {
                    cumSum += d.value;
                    return { date: d.date, value: cumSum * multiplier, raw: d.value * multiplier, count: d.count };
                });
                
                // Apply z-score if selected
                if (transform === 'zscore' && result.length > 0) {
                    const values = result.map(d => d.value);
                    result = applyZScore(result, values);
                }
                
                return result;
            } else {
                // Daily mode: raw daily values with optional smoothing/transform
                let dailyData = sorted.map(d => ({
                    date: d.date,
                    value: d.value * multiplier,
                    raw: d.value * multiplier,
                    count: d.count
                }));
                
                // First apply rolling average smoothing if window > 1
                if (smoothing > 1) {
                    dailyData = dailyData.map((d, i) => {
                        const windowStart = Math.max(0, i - smoothing + 1);
                        const windowData = dailyData.slice(windowStart, i + 1);
                        const avg = windowData.reduce((sum, item) => sum + item.value, 0) / windowData.length;
                        return { ...d, value: avg };
                    });
                }
                
                // Then apply z-score normalization if selected
                if (transform === 'zscore') {
                    const values = dailyData.map(d => d.value);
                    dailyData = applyZScore(dailyData, values);
                }
                
                return dailyData;
            }
        }
        

        // Calculate Pearson correlation between two aligned arrays
        function calculateCorrelation(arr1, arr2) {
            if (arr1.length !== arr2.length || arr1.length < 3) return null;
            
            const n = arr1.length;
            const mean1 = arr1.reduce((a, b) => a + b, 0) / n;
            const mean2 = arr2.reduce((a, b) => a + b, 0) / n;
            
            let num = 0, den1 = 0, den2 = 0;
            for (let i = 0; i < n; i++) {
                const d1 = arr1[i] - mean1;
                const d2 = arr2[i] - mean2;
                num += d1 * d2;
                den1 += d1 * d1;
                den2 += d2 * d2;
            }
            
            if (den1 === 0 || den2 === 0) return null;
            return num / Math.sqrt(den1 * den2);
        }

        // Get top 5 sentiment suggestions for a tile based on correlation
        const MIN_DATAPOINTS_FOR_SUGGESTION = 40; // Minimum aligned data points required for statistical significance
        
        function getSentimentSuggestions(state) {
            const mainData = getMainData(state);
            if (mainData.length < MIN_DATAPOINTS_FOR_SUGGESTION) return [];
            
            const mainDates = new Set(mainData.map(d => d.date));
            const results = [];
            
            // Test all combinations: topic × indexType
            const indexTypes = ['international', 'domestic'];
            
            for (const topic of sentimentTopics) {
                for (const indexType of indexTypes) {
                    const testSentiment = { 
                        topic: topic, 
                        indexType: indexType, 
                        inverted: false 
                    };
                    const sentData = getSentimentData(state.country, testSentiment);
                    if (sentData.length < MIN_DATAPOINTS_FOR_SUGGESTION) continue;
                    
                    // Align data by date
                    const sentMap = new Map(sentData.map(d => [d.date, d.value]));
                    const aligned1 = [], aligned2 = [];
                    
                    for (const d of mainData) {
                        if (sentMap.has(d.date)) {
                            aligned1.push(d.value);
                            aligned2.push(sentMap.get(d.date));
                        }
                    }
                    
                    // Require minimum aligned data points for statistical significance
                    if (aligned1.length < MIN_DATAPOINTS_FOR_SUGGESTION) continue;
                    
                    const corr = calculateCorrelation(aligned1, aligned2);
                    if (corr !== null) {
                        // Best fits are closest to +1 or -1 (highest absolute correlation)
                        results.push({
                            topic,
                            indexType,
                            correlation: corr, // Keep raw correlation (positive or negative)
                            absCorr: Math.abs(corr),
                            dataPoints: aligned1.length
                        });
                    }
                }
            }
            
            // Sort by absolute correlation (closest to +1 or -1) and take top 5
            results.sort((a, b) => b.absCorr - a.absCorr);
            return results.slice(0, 5);
        }

        // Abbreviate topic name for chip display
        function abbreviateTopic(topic) {
            // Shorten common prefixes
            let short = topic
                .replace('Economic Data-', '')
                .replace('Economic Data', 'Econ')
                .replace('Geopolitical-', 'Geo-')
                .replace('Geopolitical', 'Geo')
                .replace('Financial Markets-', 'Fin-')
                .replace('Financial Markets', 'Fin')
                .replace('Central Bank', 'CB')
                .replace('Interest Rate', 'IR')
                .replace('Government', 'Gov')
                .replace('International', 'Intl');
            
            // Truncate if still too long
            if (short.length > 12) {
                short = short.substring(0, 11) + '…';
            }
            return short;
        }

                sentObj.data.forEach(d => { sentimentMap[d.date] = d.value; });
                
                // Align sentiment data to main data dates, carrying forward last known value
                let lastKnownValue = 0;
                const alignedSentiment = mainData.map(d => {

                    borderWidth: 1,
                    yAxisID: 'y1',
                    stack: 'sentiment',
                    order: 2 // Draw before main line

            // Add main data line last (renders on top)

        // Update sentiment suggestions for a tile
        function updateSuggestions(index) {
            const state = tileStates[index];
            const container = document.getElementById(`suggestions-row-${index}`);
            if (!container) return;
            
            const suggestions = getSentimentSuggestions(state);
            
            if (suggestions.length === 0) {
                container.innerHTML = '<span style="color: rgba(255,255,255,0.4); font-size: 0.7rem;">No data available</span>';
                return;
            }
            
            container.innerHTML = suggestions.map((s, i) => {
                const shortTopic = abbreviateTopic(s.topic);
                const shortIndex = s.indexType === 'international' ? 'Intl' : 'Dom';
                const corrSign = s.correlation >= 0 ? '+' : '';
                const corrClass = s.correlation >= 0 ? '' : 'negative';
                
                return `<div class="suggestion-chip" 
                    data-index="${index}" 
                    data-topic="${s.topic}" 
                    data-indextype="${s.indexType}" 
                    data-corr="${s.correlation.toFixed(3)}"
                    data-points="${s.dataPoints}">
                    <span class="chip-label">${shortTopic} ${shortIndex}</span>
                    <span class="corr-value ${corrClass}">${corrSign}${s.correlation.toFixed(2)}</span>
                </div>`;
            }).join('');
            
            // Add click handlers
            container.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    // Remove tooltip if present before rebuilding
                    if (chip._tooltip) {
                        chip._tooltip.remove();
                        chip._tooltip = null;
                    }
                    
                    const idx = parseInt(chip.dataset.index);
                    const topic = chip.dataset.topic;
                    const indexType = chip.dataset.indextype;
                    
                    const newSentiment = { topic, indexType, inverted: false, mode: 'daily', smoothing: 14, transform: 'rolling' };
                    
                    // Find first empty slot or add new (up to MAX_SENTIMENTS)
                    const sentiments = tileStates[idx].sentiments;
                    let added = false;
                    
                    // First, try to fill an empty slot
                    for (let i = 0; i < sentiments.length; i++) {
                        if (!sentiments[i].topic) {
                            sentiments[i] = newSentiment;
                            added = true;
                            break;
                        }
                    }
                    
                    // If no empty slot, add new if under limit
                    if (!added && sentiments.length < MAX_SENTIMENTS) {
                        sentiments.push(newSentiment);
                        added = true;
                    }
                    
                    // If still not added (all slots full), replace first
                    if (!added) {
                        sentiments[0] = newSentiment;
                    }
                    
                    // Rebuild tile to update UI
                    rebuildTile(idx);
                });
                
                // Add hover tooltip
                chip.addEventListener('mouseenter', (e) => {
                    const topic = chip.dataset.topic;
                    const indexType = chip.dataset.indextype === 'international' ? 'International' : 'Domestic';
                    const corr = parseFloat(chip.dataset.corr);
                    const points = chip.dataset.points;
                    const corrClass = corr >= 0 ? 'positive' : 'negative';
                    const corrSign = corr >= 0 ? '+' : '';
                    const tooltip = document.createElement('div');
                    tooltip.className = 'suggestion-tooltip';
                    tooltip.innerHTML = `
                        <div class="tooltip-row"><span class="tooltip-label">Topic:</span> <span class="tooltip-value">${topic}</span></div>
                        <div class="tooltip-row"><span class="tooltip-label">Index:</span> <span class="tooltip-value">${indexType}</span></div>
                        <div class="tooltip-row"><span class="tooltip-label">Points:</span> <span class="tooltip-value">${points}</span></div>
                        <div class="tooltip-corr ${corrClass}">Correlation: ${corrSign}${corr.toFixed(3)}</div>
                    `;
                    
                    document.body.appendChild(tooltip);
                    
                    const rect = chip.getBoundingClientRect();
                    tooltip.style.left = rect.left + 'px';
                    tooltip.style.top = (rect.top - tooltip.offsetHeight - 8) + 'px';
                    
                    // Adjust if off-screen
                    if (tooltip.offsetLeft + tooltip.offsetWidth > window.innerWidth) {
                        tooltip.style.left = (window.innerWidth - tooltip.offsetWidth - 10) + 'px';
                    }
                    if (parseFloat(tooltip.style.top) < 0) {
                        tooltip.style.top = (rect.bottom + 8) + 'px';
                    }
                    
                    chip._tooltip = tooltip;
                });
                
                chip.addEventListener('mouseleave', (e) => {
                    if (chip._tooltip) {
                        chip._tooltip.remove();
                        chip._tooltip = null;
                    }
                });
            });
        }

        // =============================================
        // THEMATICS PAGE FUNCTIONALITY

        // Country group definitions
        const COUNTRY_GROUPS = {
            all: null, // Will be computed from available data
            g7: ['United_States', 'United_Kingdom', 'Germany', 'France', 'Japan', 'Canada', 'Italy'],
            asia: ['China', 'Japan', 'India', 'South_Korea', 'Indonesia', 'Taiwan', 'Thailand', 
                   'Singapore', 'Hong_Kong', 'Vietnam', 'Bangladesh', 'Pakistan', 'Malaysia', 'Philippines'],
            brics: ['Brazil', 'Russia', 'India', 'China', 'South_Africa', 'United_Arab_Emirates', 
                    'Saudi_Arabia', 'Argentina', 'Mexico', 'Indonesia']
        };

        // Topic groups (main topics that subtopics roll up to)
        const TOPIC_GROUPS = [
            'Economic Data', 'Extreme Weather', 'Fiscal Policy', 'Monetary Policy',
            'Politics', 'Wars', 'Pandemic', 'Terrorist Attacks', 'Natural Disaster'
        ];

        // Thematics state
        let thematicsLookbackDays = 30;
        let thematicsTopN = 10;
        let thematicsCountryGroup = 'all';
        let thematicsDataSource = 'international';
        let thematicsSelectedTopics = ['Economic Data', 'Extreme Weather', 'Fiscal Policy', 'Politics', 'Wars'];
        let thematicsCustomCountries = [];
        let thematicsHiddenColumns = new Set(); // Track manually hidden columns
        let thematicsSortColumn = 'avg'; // 'avg', 'country', or topic name
        let thematicsSortDirection = 'desc'; // 'asc' or 'desc'
        let thematicsShowCounts = false; // Toggle to show article counts
        let thematicsDecimalPlaces = 2; // Number of decimal places to display

        // Get the latest date from sentiment data
        function getLastUpdatedDate() {
            let latestDate = null;
            
            // Check both international and domestic data
            const dataSources = [sentimentDataIntl, sentimentDataDomestic];
            
            for (const sentData of dataSources) {
                if (!sentData) continue;
                
                for (const topic of Object.keys(sentData)) {
                    for (const country of Object.keys(sentData[topic])) {
                        const entries = sentData[topic][country];
                        if (entries && entries.length > 0) {
                            // Check all entries to find the maximum date
                            for (const entry of entries) {
                                if (entry && entry.date) {
                                    if (!latestDate || entry.date > latestDate) {
                                        latestDate = entry.date;
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            return latestDate;
        }

        // Update the last updated display
        function updateLastUpdatedDisplay() {
            const lastUpdatedEl = document.getElementById('lastUpdated');
            if (!lastUpdatedEl) return;
            
            const lastDate = getLastUpdatedDate();
            if (lastDate) {
                // Format date nicely
                const date = new Date(lastDate);
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                lastUpdatedEl.textContent = date.toLocaleDateString('en-US', options);
            } else {
                lastUpdatedEl.textContent = 'N/A';
            }
        }

        // Get all available countries from sentiment data
        function getAvailableSentimentCountries() {
            const countries = new Set();
            const sentData = thematicsDataSource === 'domestic' ? sentimentDataDomestic : sentimentDataIntl;
            if (!sentData) return [];
            
            for (const topic of Object.keys(sentData)) {
                for (const country of Object.keys(sentData[topic])) {
                    countries.add(country);
                }
            }
            return Array.from(countries).sort();
        }

        // Get topic group from full topic name
        function getTopicGroup(topicName) {
            // e.g., "Economic Data-Consumer Spending" -> "Economic Data"
            const dashIndex = topicName.indexOf('-');
            if (dashIndex > 0) {
                return topicName.substring(0, dashIndex);
            }
            return topicName;
        }

        // Get subtopic label from full topic name
        function getSubtopicLabel(topicName) {
            // e.g., "Economic Data-Consumer Spending" -> "Consumer Spending"
            const dashIndex = topicName.indexOf('-');
            if (dashIndex > 0) {
                return topicName.substring(dashIndex + 1);
            }
            return topicName; // If no dash, return full name (e.g., "Wars")
        }

        // Get all subtopics for selected topic groups (all available, not filtered by hidden)
        function getAllAvailableSubtopics() {
            const sentData = thematicsDataSource === 'domestic' ? sentimentDataDomestic : sentimentDataIntl;
            if (!sentData || !sentimentTopics) return [];
            
            const result = [];
            
            // For each selected topic group, find its subtopics or use the group itself
            for (const selectedGroup of thematicsSelectedTopics) {
                // Find all subtopics for this group (topics with dash that start with this group)
                const groupSubtopics = sentimentTopics.filter(topic => {
                    const topicGroup = getTopicGroup(topic);
                    return topicGroup === selectedGroup && topic.includes('-');
                });
                
                if (groupSubtopics.length > 0) {
                    // Has subtopics - add them
                    result.push(...groupSubtopics);
                } else {
                    // No subtopics - add the topic group itself if it exists in the data
                    if (sentimentTopics.includes(selectedGroup)) {
                        result.push(selectedGroup);
                    }
                }
            }
            
            return result;
        }

        // Get visible subtopics (filtered by hidden columns)
        function getVisibleSubtopics() {
            return getAllAvailableSubtopics().filter(topic => !thematicsHiddenColumns.has(topic));
        }

        // Render column toggle pills
        function renderColumnToggles() {
            const container = document.getElementById('columnToggles');
            if (!container) return;
            
            const allSubtopics = getAllAvailableSubtopics();
            
            if (allSubtopics.length === 0) {
                container.innerHTML = '<span class="column-toggles-empty">Select topic groups above to see columns</span>';
                return;
            }
            
            let html = '';
            for (const topic of allSubtopics) {
                const label = getSubtopicLabel(topic);
                const topicGroup = getTopicGroup(topic);
                const isHidden = thematicsHiddenColumns.has(topic);
                const groupTag = topic.includes('-') ? `<span class="topic-group-tag">${topicGroup.split(' ')[0]}</span>` : '';
                
                html += `<span class="column-toggle ${isHidden ? 'hidden' : ''}" data-topic="${topic}" title="${topic}">
                    ${label} ${groupTag}
                </span>`;
            }
            
            container.innerHTML = html;
            
            // Add event listeners
            container.querySelectorAll('.column-toggle').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const topic = toggle.dataset.topic;
                    if (thematicsHiddenColumns.has(topic)) {
                        thematicsHiddenColumns.delete(topic);
                        toggle.classList.remove('hidden');
                    } else {
                        thematicsHiddenColumns.add(topic);
                        toggle.classList.add('hidden');
                    }
                    renderThematicsTable();
                });
            });
        }

        // Compute sentiment for a country and specific topic (not aggregated)
        function computeThematicsSentiment(country, topic) {
            const sentData = thematicsDataSource === 'domestic' ? sentimentDataDomestic : sentimentDataIntl;
            if (!sentData || !sentData[topic]) return null;
            
            const countryData = sentData[topic][country];
            if (!countryData || countryData.length === 0) return null;
            
            // Calculate cutoff date
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - thematicsLookbackDays);
            const cutoffStr = cutoffDate.toISOString().split('T')[0];
            
            let totalSentiment = 0;
            let totalCount = 0;
            
            // Sum sentiment and count for dates within lookback
            for (const entry of countryData) {
                if (entry.date >= cutoffStr) {
                    // value is already sentiment_sum/count average for that day
                    // count is the number of articles
                    totalSentiment += entry.value * entry.count;
                    totalCount += entry.count;
                }
            }
            
            if (totalCount === 0) return null;
            return {
                avgSentiment: totalSentiment / totalCount,
                count: totalCount
            };
        }

        // Get countries based on current group selection
        function getThematicsCountries() {
            if (thematicsCountryGroup === 'custom') {
                return thematicsCustomCountries.filter(c => c.trim()).map(c => c.trim());
            }
            
            const groupCountries = COUNTRY_GROUPS[thematicsCountryGroup];
            if (groupCountries) {
                return groupCountries;
            }
            
            // 'all' - return all available countries
            return getAvailableSentimentCountries();
        }

        // Compute all thematics data
        function computeThematicsData() {
            const countries = getThematicsCountries();
            const visibleSubtopics = getVisibleSubtopics();
            const data = [];
            
            for (const country of countries) {
                const row = { country };
                let hasAnyData = false;
                
                for (const topic of visibleSubtopics) {
                    const result = computeThematicsSentiment(country, topic);
                    row[topic] = result;
                    if (result) hasAnyData = true;
                }
                
                // Only include countries that have at least some data
                if (hasAnyData) {
                    // Calculate average sentiment across all topics for ranking
                    let totalSent = 0;
                    let topicCount = 0;
                    for (const topic of visibleSubtopics) {
                        if (row[topic]) {
                            totalSent += row[topic].avgSentiment;
                            topicCount++;
                        }
                    }
                    row.avgSentiment = topicCount > 0 ? totalSent / topicCount : 0;
                    data.push(row);
                }
            }
            
            return { data, visibleSubtopics };
        }

        // Sort thematics data based on current sort settings
        function sortThematicsData(data) {
            const col = thematicsSortColumn;
            const isDesc = thematicsSortDirection === 'desc';
            
            return [...data].sort((a, b) => {
                let valA, valB;
                
                if (col === 'country') {
                    // Sort by country name alphabetically
                    const nameA = (COUNTRY_NAMES && COUNTRY_NAMES[a.country]) || a.country;
                    const nameB = (COUNTRY_NAMES && COUNTRY_NAMES[b.country]) || b.country;
                    const cmp = nameA.localeCompare(nameB);
                    return isDesc ? -cmp : cmp;
                } else if (col === 'avg') {
                    // Sort by average sentiment
                    valA = a.avgSentiment || 0;
                    valB = b.avgSentiment || 0;
                } else {
                    // Sort by specific topic column
                    valA = (a[col] && a[col].avgSentiment) || -999;
                    valB = (b[col] && b[col].avgSentiment) || -999;
                }
                
                // Descending: higher values first (valB - valA)
                // Ascending: lower values first (valA - valB)
                return isDesc ? (valB - valA) : (valA - valB);
            });
        }

        // Handle column header click for sorting
        function handleColumnSort(column) {
            if (thematicsSortColumn === column) {
                // Toggle direction if clicking same column
                thematicsSortDirection = thematicsSortDirection === 'desc' ? 'asc' : 'desc';
            } else {
                // New column, default to descending
                thematicsSortColumn = column;
                thematicsSortDirection = 'desc';
            }
            renderThematicsTable();
        }

        // Store visible subtopics for use in row rendering
        let currentVisibleSubtopics = [];

        // Render thematics table
        function renderThematicsTable() {
            const headerRow = document.getElementById('thematicsTableHeader');
            const tableBody = document.getElementById('thematicsTableBody');
            const summary = document.getElementById('thematicsSummary');
            
            // Compute data
            const { data: allData, visibleSubtopics } = computeThematicsData();
            currentVisibleSubtopics = visibleSubtopics;
            
            // Sort indicator helper
            const sortIndicator = (col) => {
                if (thematicsSortColumn === col) {
                    return `<span class="sort-indicator">${thematicsSortDirection === 'desc' ? '▼' : '▲'}</span>`;
                }
                return '<span class="sort-indicator">▼</span>';
            };
            
            const sortedClass = (col) => thematicsSortColumn === col ? 'sorted' : '';
            
            // Build header with clickable columns
            let headerHTML = `<th class="${sortedClass('country')}" data-sort="country">Country${sortIndicator('country')}</th>`;
            for (const topic of visibleSubtopics) {
                const label = getSubtopicLabel(topic);
                headerHTML += `<th class="${sortedClass(topic)}" data-sort="${topic}" title="${topic}">${label}${sortIndicator(topic)}</th>`;
            }
            headerHTML += `<th class="${sortedClass('avg')}" data-sort="avg">Avg${sortIndicator('avg')}</th>`;
            headerRow.innerHTML = headerHTML;
            
            // Add click handlers to headers
            headerRow.querySelectorAll('th').forEach(th => {
                th.addEventListener('click', () => {
                    const sortCol = th.dataset.sort;
                    if (sortCol) handleColumnSort(sortCol);
                });
            });
            
            // Sort data
            const sortedData = sortThematicsData(allData);
            
            // Get top N and bottom N from sorted data
            const topN = Math.min(thematicsTopN, Math.floor(sortedData.length / 2));
            const topCountries = sortedData.slice(0, topN);
            const bottomCountries = sortedData.slice(-topN);
            
            // Update summary
            const allSubtopics = getAllAvailableSubtopics();
            const hiddenCount = allSubtopics.length - visibleSubtopics.length;
            const hiddenText = hiddenCount > 0 ? ` (${hiddenCount} hidden)` : '';
            const sortColName = thematicsSortColumn === 'avg' ? 'Average' : 
                               thematicsSortColumn === 'country' ? 'Country' : 
                               getSubtopicLabel(thematicsSortColumn);
            const sortText = `sorted by ${sortColName} ${thematicsSortDirection === 'desc' ? '↓' : '↑'}`;
            summary.textContent = `Top ${topN} & bottom ${topN} of ${sortedData.length} | ${visibleSubtopics.length} cols${hiddenText} | ${sortText} | ${thematicsDataSource} | ${thematicsLookbackDays}d`;
            
            // Build table body
            let bodyHTML = '';
            const colSpan = visibleSubtopics.length + 2;
            
            // Top section header
            bodyHTML += `<tr><td colspan="${colSpan}" class="top-section-header">Top ${topN}</td></tr>`;
            
            // Top countries
            for (const row of topCountries) {
                bodyHTML += renderThematicsRow(row, visibleSubtopics);
            }
            
            // Separator
            bodyHTML += `<tr><td colspan="${colSpan}" class="section-separator"></td></tr>`;
            
            // Bottom section header
            bodyHTML += `<tr><td colspan="${colSpan}" class="bottom-section-header">Bottom ${topN}</td></tr>`;
            
            // Bottom countries
            for (const row of bottomCountries) {
                bodyHTML += renderThematicsRow(row, visibleSubtopics);
            }
            
            tableBody.innerHTML = bodyHTML;
        }

        // Export thematics table to CSV
        function exportThematicsTableToCsv() {
            const { data: allData, visibleSubtopics } = computeThematicsData();
            
            if (allData.length === 0 || visibleSubtopics.length === 0) {
                alert('No data to export');
                return;
            }
            
            // Sort and slice data same as table display
            const sortedData = sortThematicsData(allData);
            const topN = thematicsTopN;
            const topCountries = sortedData.slice(0, topN);
            const bottomCountries = sortedData.slice(-topN);
            
            // Combine top and bottom (avoiding duplicates if total < topN*2)
            const seenCountries = new Set(topCountries.map(r => r.country));
            const exportData = [...topCountries];
            for (const row of bottomCountries) {
                if (!seenCountries.has(row.country)) {
                    exportData.push(row);
                }
            }
            
            // Build CSV header
            const headers = ['Country', ...visibleSubtopics, 'Average'];
            let csv = headers.map(h => `"${h}"`).join(',') + '\n';
            
            // Build CSV rows
            for (const row of exportData) {
                const countryName = (typeof COUNTRY_NAMES !== 'undefined' && COUNTRY_NAMES[row.country]) 
                    ? COUNTRY_NAMES[row.country] : row.country.replace(/_/g, ' ');
                
                const values = [countryName];
                
                for (const topic of visibleSubtopics) {
                    const data = row[topic];
                    if (data) {
                        values.push(data.avgSentiment.toFixed(thematicsDecimalPlaces));
                    } else {
                        values.push('');
                    }
                }
                
                values.push(row.avgSentiment.toFixed(thematicsDecimalPlaces));
                
                csv += values.map(v => `"${v}"`).join(',') + '\n';
            }
            
            // Create and trigger download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            
            // Generate filename with date
            const date = new Date().toISOString().split('T')[0];
            const lookbackLabel = thematicsLookbackDays === 1 ? '1d' : 
                                  thematicsLookbackDays === 7 ? '1w' : 
                                  thematicsLookbackDays === 30 ? '1m' : '3m';
            link.setAttribute('download', `thematics_sentiment_${lookbackLabel}_${date}.csv`);
            
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Render a single row
        function renderThematicsRow(row, activeSubtopics) {
            const flag = (typeof COUNTRY_FLAGS !== 'undefined' && COUNTRY_FLAGS[row.country]) 
                ? COUNTRY_FLAGS[row.country] : '';
            const name = (typeof COUNTRY_NAMES !== 'undefined' && COUNTRY_NAMES[row.country]) 
                ? COUNTRY_NAMES[row.country] : row.country.replace(/_/g, ' ');
            
            let html = `<tr><td><span class="country-flag">${flag}</span>${name}</td>`;
            
            for (const topic of activeSubtopics) {
                const data = row[topic];
                if (data) {
                    const sentiment = data.avgSentiment;
                    const cssClass = sentiment > 0.05 ? 'positive' : (sentiment < -0.05 ? 'negative' : 'neutral');
                    const displayVal = (sentiment >= 0 ? '+' : '') + sentiment.toFixed(thematicsDecimalPlaces);
                    const countDisplay = thematicsShowCounts ? `<span class="sentiment-count">${data.count}</span>` : '';
                    html += `<td><span class="sentiment-cell ${cssClass}" title="${topic}\nCount: ${data.count}">${displayVal}${countDisplay}</span></td>`;
                } else {
                    html += `<td><span class="sentiment-cell no-data">-</span></td>`;
                }
            }
            
            // Average column (no count for average)
            const avgClass = row.avgSentiment > 0.05 ? 'positive' : (row.avgSentiment < -0.05 ? 'negative' : 'neutral');
            const avgDisplay = (row.avgSentiment >= 0 ? '+' : '') + row.avgSentiment.toFixed(thematicsDecimalPlaces);
            html += `<td><span class="sentiment-cell ${avgClass}"><strong>${avgDisplay}</strong></span></td>`;
            
            html += '</tr>';
            return html;
        }
