        // Initialize country autocomplete
        function initCountryAutocomplete() {
            const input = document.getElementById('thematicsCustomCountries');
            const dropdown = document.getElementById('countryAutocomplete');
            const tagsContainer = document.getElementById('selectedCountriesTags');
            
            if (!input || !dropdown || !tagsContainer) return;
            
            let highlightedIndex = -1;
            
            // Render selected country tags
            function renderSelectedTags() {
                tagsContainer.innerHTML = thematicsCustomCountries.map(code => {
                    const name = (COUNTRY_NAMES && COUNTRY_NAMES[code]) || code.replace(/_/g, ' ');
                    const flag = (COUNTRY_FLAGS && COUNTRY_FLAGS[code]) || '';
                    return `<span class="country-tag" data-code="${code}">
                        ${flag} ${name}
                        <span class="remove-tag" data-code="${code}">×</span>
                    </span>`;
                }).join('');
                
                // Add remove handlers
                tagsContainer.querySelectorAll('.remove-tag').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const code = btn.dataset.code;
                        thematicsCustomCountries = thematicsCustomCountries.filter(c => c !== code);
                        renderSelectedTags();
                        renderThematicsTable();
                    });
                });
            }
            
            // Show autocomplete suggestions
            function showSuggestions(query) {
                const allCountries = getAllCountryCodes();
                const queryLower = query.toLowerCase();
                
                const matches = allCountries.filter(code => {
                    if (thematicsCustomCountries.includes(code)) return false;
                    const name = (COUNTRY_NAMES && COUNTRY_NAMES[code]) || code;
                    return name.toLowerCase().includes(queryLower) || 
                           code.toLowerCase().includes(queryLower);
                }).slice(0, 10); // Limit to 10 suggestions
                
                if (matches.length === 0 || query.length === 0) {
                    dropdown.classList.remove('active');
                    return;
                }
                
                dropdown.innerHTML = matches.map((code, idx) => {
                    const name = (COUNTRY_NAMES && COUNTRY_NAMES[code]) || code.replace(/_/g, ' ');
                    const flag = (COUNTRY_FLAGS && COUNTRY_FLAGS[code]) || '';
                    const isSelected = thematicsCustomCountries.includes(code);
                    return `<div class="country-autocomplete-item ${isSelected ? 'selected' : ''} ${idx === highlightedIndex ? 'highlighted' : ''}" data-code="${code}" data-index="${idx}">
                        ${flag} ${name}
                        <span class="country-code">${code}</span>
                    </div>`;
                }).join('');
                
                dropdown.classList.add('active');
                highlightedIndex = -1;
                
                // Add click handlers
                dropdown.querySelectorAll('.country-autocomplete-item').forEach(item => {
                    item.addEventListener('click', () => {
                        selectCountry(item.dataset.code);
                    });
                });
            }
            
            // Select a country
            function selectCountry(code) {
                if (!thematicsCustomCountries.includes(code)) {
                    thematicsCustomCountries.push(code);
                    renderSelectedTags();
                    renderThematicsTable();
                }
                input.value = '';
                dropdown.classList.remove('active');
            }
            
            // Input event handlers
            input.addEventListener('input', (e) => {
                showSuggestions(e.target.value);
            });
            
            input.addEventListener('focus', () => {
                if (input.value.length > 0) {
                    showSuggestions(input.value);
                }
            });
            
            input.addEventListener('keydown', (e) => {
                const items = dropdown.querySelectorAll('.country-autocomplete-item');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
                    updateHighlight(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIndex = Math.max(highlightedIndex - 1, 0);
                    updateHighlight(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlightedIndex >= 0 && items[highlightedIndex]) {
                        selectCountry(items[highlightedIndex].dataset.code);
                    }
                } else if (e.key === 'Escape') {
                    dropdown.classList.remove('active');
                }
            });
            
            function updateHighlight(items) {
                items.forEach((item, idx) => {
                    item.classList.toggle('highlighted', idx === highlightedIndex);
                });
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('active');
                }
            });
            
            // Initial render of tags
            renderSelectedTags();
        }

        // Initialize thematics event listeners
        function initThematics() {
            // Lookback select
            document.getElementById('thematicsLookback')?.addEventListener('change', (e) => {
                thematicsLookbackDays = parseInt(e.target.value);
                renderThematicsTable();
            });
            
            // Top N input
            document.getElementById('thematicsTopN')?.addEventListener('change', (e) => {
                thematicsTopN = Math.max(1, Math.min(50, parseInt(e.target.value) || 10));
                e.target.value = thematicsTopN;
                renderThematicsTable();
            });
            
            // Country group select
            document.getElementById('thematicsCountryGroup')?.addEventListener('change', (e) => {
                thematicsCountryGroup = e.target.value;
                const customWrapper = document.getElementById('customCountriesWrapper');
                if (customWrapper) {
                    customWrapper.classList.toggle('visible', thematicsCountryGroup === 'custom');
                }
                renderThematicsTable();
            });
            
            // Custom countries autocomplete
            initCountryAutocomplete();
            
            // Show counts toggle button
            document.getElementById('showCountsBtn')?.addEventListener('click', (e) => {
                thematicsShowCounts = !thematicsShowCounts;
                e.target.classList.toggle('active', thematicsShowCounts);
                e.target.textContent = thematicsShowCounts ? 'Hide Counts' : 'Show Counts';
                renderThematicsTable();
            });
            
            // Decimal places select
            document.getElementById('decimalPlacesSelect')?.addEventListener('change', (e) => {
                thematicsDecimalPlaces = parseInt(e.target.value, 10);
                renderThematicsTable();
            });
            
            // Export CSV button
            document.getElementById('exportCsvBtn')?.addEventListener('click', () => {
                exportThematicsTableToCsv();
            });
            
            // Data source toggle
            document.querySelectorAll('.data-source-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    thematicsDataSource = btn.dataset.source;
                    document.querySelectorAll('.data-source-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.source === thematicsDataSource);
                    });
                    renderColumnToggles();
                    renderThematicsTable();
                });
            });
            
            // Topic checkboxes
            document.querySelectorAll('.topic-checkbox').forEach(checkbox => {
                checkbox.addEventListener('click', (e) => {
                    e.preventDefault(); // Prevent default checkbox behavior
                    const topic = checkbox.dataset.topic;
                    const isActive = checkbox.classList.contains('active');
                    
                    if (isActive) {
                        // Deactivate
                        checkbox.classList.remove('active');
                        checkbox.querySelector('input').checked = false;
                        thematicsSelectedTopics = thematicsSelectedTopics.filter(t => t !== topic);
                    } else {
                        // Activate
                        checkbox.classList.add('active');
                        checkbox.querySelector('input').checked = true;
                        if (!thematicsSelectedTopics.includes(topic)) {
                            thematicsSelectedTopics.push(topic);
                        }
                    }
                    
                    // Re-order to match TOPIC_GROUPS order
                    thematicsSelectedTopics.sort((a, b) => 
                        TOPIC_GROUPS.indexOf(a) - TOPIC_GROUPS.indexOf(b)
                    );
                    
                    // Update column toggles and table
                    renderColumnToggles();
                    renderThematicsTable();
                });
            });
            
            // Tab navigation
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(btn.dataset.tab);
                });
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setView(parseInt(btn.dataset.view));
                });
            });

            document.querySelectorAll('.lookback-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setLookback(parseInt(btn.dataset.lookback));
                });
            });

            initThematics();
            loadData();
        });
    </script>
</body>
</html>
